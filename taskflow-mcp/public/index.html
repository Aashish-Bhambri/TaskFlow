<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow SaaS — AI-First Project Management Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#090a0f',
            cardBg: '#11131a',
            cardHover: '#161922',
            borderSubtle: '#1e2230',
            borderHover: '#2d3348',
            accentIndigo: '#5e6ad2',
            accentEmerald: '#10b981',
            accentRose: '#f43f5e',
            accentAmber: '#f59e0b'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <!-- Google Fonts & Phosphor Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { background-color: #090a0f; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #1e2230; border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #2d3348; }
    .card-enter { animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- Top Linear-Style Navigation -->
  <header class="h-12 border-b border-borderSubtle bg-obsidian/90 backdrop-blur px-4 flex items-center justify-between sticky top-0 z-50 text-xs">
    
    <!-- Left: Brand & Breadcrumb -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-2">
        <div class="w-6 h-6 rounded bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-sm">
          <i class="ph-bold ph-tree-structure text-sm"></i>
        </div>
        <span class="font-semibold text-slate-200 tracking-tight">taskflow</span>
      </div>

      <span class="text-slate-600">/</span>

      <div class="flex items-center space-x-1.5 text-slate-300">
        <i class="ph ph-folder text-indigo-400"></i>
        <span class="font-medium">Acme Corp</span>
      </div>

      <span class="text-slate-600">/</span>

      <!-- Sprint Completion Badge -->
      <span id="sprintBadge" class="px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-300 font-mono text-[11px] border border-indigo-500/20">
        Sprint 4 &bull; Loading...
      </span>
    </div>

    <!-- Center: Search bar -->
    <div class="hidden md:flex items-center space-x-2 bg-cardBg border border-borderSubtle px-3 py-1 rounded-md text-slate-400 w-72 justify-between">
      <div class="flex items-center space-x-2">
        <i class="ph ph-magnifying-glass text-slate-500"></i>
        <input id="searchInput" type="text" placeholder="Filter tasks or press ⌘K..." class="bg-transparent focus:outline-none text-[11px] text-slate-200 placeholder-slate-500 w-full" oninput="filterTasks()">
      </div>
      <kbd class="px-1.5 py-0.5 rounded bg-obsidian border border-borderSubtle font-mono text-[10px] text-slate-500">⌘K</kbd>
    </div>

    <!-- Right: Real-time SSE Live Indicator & Actions -->
    <div class="flex items-center space-x-3">
      <!-- Live Sync Status -->
      <div id="liveSyncPill" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-md bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-[11px]">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <i class="ph ph-broadcast"></i>
        <span>Live Sync Active</span>
      </div>

      <!-- New Task Button -->
      <button onclick="openCreateModal()" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-md bg-accentIndigo hover:bg-indigo-600 text-white text-xs font-medium transition shadow-sm">
        <i class="ph-bold ph-plus text-xs"></i>
        <span>New Issue</span>
      </button>

      <!-- User Avatar -->
      <div class="w-6 h-6 rounded-full bg-indigo-900 border border-indigo-500/40 flex items-center justify-center text-[10px] font-bold text-indigo-200">
        AA
      </div>
    </div>
  </header>

  <!-- Main View Container -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- Left Mini Rail -->
    <aside class="w-14 border-r border-borderSubtle bg-obsidian flex flex-col items-center py-4 justify-between hidden sm:flex">
      <div class="space-y-4">
        <button class="w-9 h-9 rounded-lg bg-cardBg border border-borderSubtle text-indigo-400 flex items-center justify-center" title="Board View">
          <i class="ph ph-kanban text-lg"></i>
        </button>
        <button onclick="exportCalendar()" class="w-9 h-9 rounded-lg hover:bg-cardBg text-slate-500 hover:text-slate-300 flex items-center justify-center transition" title="Export iCal Calendar">
          <i class="ph ph-calendar text-lg"></i>
        </button>
      </div>

      <!-- MCP Indicator -->
      <div class="w-9 h-9 rounded-lg bg-cardBg border border-borderSubtle flex items-center justify-center text-emerald-400" title="MCP Server Connected">
        <i class="ph-fill ph-plugs-connected text-base"></i>
      </div>
    </aside>

    <!-- Center Canvas: Kanban Columns Grid -->
    <main class="flex-1 flex flex-col bg-obsidian overflow-x-auto custom-scroll p-5">
      
      <!-- Filter and Stats Bar -->
      <div class="flex items-center justify-between mb-4 text-xs">
        <div class="flex items-center space-x-3">
          <h1 class="text-sm font-semibold text-white tracking-tight">Active Sprint Board</h1>
          <span id="taskStats" class="text-slate-500 font-mono">0 issues &bull; 0 hrs</span>
        </div>

        <div class="flex items-center space-x-2">
          <button onclick="loadTasks()" class="flex items-center space-x-1 px-2 py-1 rounded bg-cardBg hover:bg-cardHover border border-borderSubtle text-slate-400 hover:text-white transition">
            <i class="ph ph-arrows-clockwise text-xs"></i>
            <span>Refresh</span>
          </button>
        </div>
      </div>

      <!-- Kanban Grid -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-3.5 min-w-[960px] flex-1 pb-4">
        
        <!-- Column: BACKLOG & TODO -->
        <div class="flex flex-col bg-cardBg/40 border border-borderSubtle rounded-lg p-3">
          <div class="flex items-center justify-between mb-3 px-1 text-xs">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-slate-500"></span>
              <span class="font-medium text-slate-300">Backlog & Todo</span>
              <span id="count-BACKLOG" class="text-slate-500 font-mono text-[11px]">0</span>
            </div>
            <button onclick="openCreateModal('BACKLOG')" class="text-slate-500 hover:text-slate-300"><i class="ph ph-plus"></i></button>
          </div>
          <div id="col-BACKLOG" class="space-y-2 flex-1 overflow-y-auto custom-scroll pr-0.5"></div>
        </div>

        <!-- Column: IN_PROGRESS -->
        <div class="flex flex-col bg-cardBg/40 border border-borderSubtle rounded-lg p-3">
          <div class="flex items-center justify-between mb-3 px-1 text-xs">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-accentAmber animate-pulse"></span>
              <span class="font-medium text-slate-300">In Progress</span>
              <span id="count-IN_PROGRESS" class="text-slate-500 font-mono text-[11px]">0</span>
            </div>
            <button onclick="openCreateModal('IN_PROGRESS')" class="text-slate-500 hover:text-slate-300"><i class="ph ph-plus"></i></button>
          </div>
          <div id="col-IN_PROGRESS" class="space-y-2 flex-1 overflow-y-auto custom-scroll pr-0.5"></div>
        </div>

        <!-- Column: BLOCKED / REVIEW -->
        <div class="flex flex-col bg-cardBg/40 border border-borderSubtle rounded-lg p-3">
          <div class="flex items-center justify-between mb-3 px-1 text-xs">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-accentRose"></span>
              <span class="font-medium text-slate-300">Review & Blocked</span>
              <span id="count-BLOCKED" class="text-slate-500 font-mono text-[11px]">0</span>
            </div>
            <button onclick="openCreateModal('BLOCKED')" class="text-slate-500 hover:text-slate-300"><i class="ph ph-plus"></i></button>
          </div>
          <div id="col-BLOCKED" class="space-y-2 flex-1 overflow-y-auto custom-scroll pr-0.5"></div>
        </div>

        <!-- Column: DONE -->
        <div class="flex flex-col bg-cardBg/40 border border-borderSubtle rounded-lg p-3">
          <div class="flex items-center justify-between mb-3 px-1 text-xs">
            <div class="flex items-center space-x-2">
              <span class="w-2 h-2 rounded-full bg-accentEmerald"></span>
              <span class="font-medium text-slate-300">Done</span>
              <span id="count-DONE" class="text-slate-500 font-mono text-[11px]">0</span>
            </div>
          </div>
          <div id="col-DONE" class="space-y-2 flex-1 overflow-y-auto custom-scroll pr-0.5"></div>
        </div>

      </div>
    </main>

    <!-- Right Side Task Detail Drawer (Hidden by default) -->
    <aside id="taskDrawer" class="w-96 border-l border-borderSubtle bg-cardBg p-5 flex-col justify-between hidden fixed right-0 top-12 bottom-0 z-40 shadow-2xl overflow-y-auto custom-scroll text-xs">
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-borderSubtle mb-4">
          <span id="drawerTaskKey" class="font-mono text-indigo-400 font-medium">TASK-KEY</span>
          <button onclick="closeDrawer()" class="text-slate-500 hover:text-white"><i class="ph-bold ph-x text-sm"></i></button>
        </div>

        <h2 id="drawerTaskTitle" class="text-base font-semibold text-white mb-2 leading-snug">Task Title</h2>
        <p id="drawerTaskDesc" class="text-slate-400 mb-4 leading-relaxed">Description...</p>

        <!-- Status Transition Controller -->
        <div class="mb-4 bg-obsidian p-3 rounded-md border border-borderSubtle space-y-2">
          <label class="text-[11px] text-slate-400 block font-medium">Move Status (State Machine):</label>
          <div class="grid grid-cols-2 gap-1.5">
            <button onclick="moveCurrentTask('TODO')" class="py-1 px-2 rounded bg-cardBg hover:bg-slate-800 text-slate-300 border border-borderSubtle transition">Todo</button>
            <button onclick="moveCurrentTask('IN_PROGRESS')" class="py-1 px-2 rounded bg-amber-950/60 hover:bg-amber-900/80 text-amber-300 border border-amber-800/50 transition">In Progress</button>
            <button onclick="moveCurrentTask('REVIEW')" class="py-1 px-2 rounded bg-purple-950/60 hover:bg-purple-900/80 text-purple-300 border border-purple-800/50 transition">Review</button>
            <button onclick="moveCurrentTask('DONE')" class="py-1 px-2 rounded bg-emerald-950/60 hover:bg-emerald-900/80 text-emerald-300 border border-emerald-800/50 transition">Done</button>
          </div>
        </div>

        <!-- Dependencies Section -->
        <div id="drawerDependencies" class="mb-4 space-y-1.5"></div>

        <!-- Comments Thread -->
        <div class="mb-4 pt-3 border-t border-borderSubtle">
          <h3 class="font-semibold text-slate-300 mb-2 flex items-center gap-1.5"><i class="ph ph-chat-circle"></i> Discussion & Notes</h3>
          <div id="drawerComments" class="space-y-2 mb-3"></div>
          
          <div class="flex gap-1.5">
            <input id="commentInput" type="text" placeholder="Write a comment or AI note..." class="flex-1 bg-obsidian border border-borderSubtle rounded px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500">
            <button onclick="postComment()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded font-medium transition">Post</button>
          </div>
        </div>

        <!-- Activity Audit Log -->
        <div class="pt-3 border-t border-borderSubtle">
          <h3 class="font-semibold text-slate-400 text-[11px] mb-2 flex items-center gap-1.5"><i class="ph ph-clock-counter-clockwise"></i> Activity Audit History</h3>
          <div id="drawerActivityLogs" class="space-y-1.5 text-[11px] text-slate-500 font-mono"></div>
        </div>
      </div>
    </aside>

  </div>

  <!-- Create Task Modal -->
  <div id="createModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-cardBg border border-borderSubtle rounded-lg w-full max-w-md p-5 text-xs card-enter space-y-3">
      <div class="flex justify-between items-center pb-2 border-b border-borderSubtle">
        <h3 class="font-semibold text-white text-sm">Create New Issue</h3>
        <button onclick="closeCreateModal()" class="text-slate-500 hover:text-white"><i class="ph-bold ph-x"></i></button>
      </div>

      <div>
        <label class="block text-slate-400 mb-1">Issue Title *</label>
        <input id="newTitle" type="text" placeholder="e.g. Build GraphQL Gateway" class="w-full bg-obsidian border border-borderSubtle rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500">
      </div>

      <div>
        <label class="block text-slate-400 mb-1">Description</label>
        <textarea id="newDesc" rows="3" placeholder="Technical specifications or acceptance criteria..." class="w-full bg-obsidian border border-borderSubtle rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-slate-400 mb-1">Priority</label>
          <select id="newPriority" class="w-full bg-obsidian border border-borderSubtle rounded px-2.5 py-1.5 text-slate-200 focus:outline-none">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
            <option value="URGENT">Urgent</option>
          </select>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Estimated Hours</label>
          <input id="newHours" type="number" step="0.5" placeholder="e.g. 4" class="w-full bg-obsidian border border-borderSubtle rounded px-3 py-1.5 text-slate-200 focus:outline-none">
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-2 border-t border-borderSubtle">
        <button onclick="closeCreateModal()" class="px-3 py-1.5 rounded bg-obsidian hover:bg-slate-800 text-slate-300 border border-borderSubtle">Cancel</button>
        <button onclick="submitNewTask()" class="px-3 py-1.5 rounded bg-accentIndigo hover:bg-indigo-600 text-white font-medium">Create Issue</button>
      </div>
    </div>
  </div>

  <!-- Client-Side JavaScript Application Logic -->
  <script>
    let allTasks = [];
    let currentActiveTaskId = null;

    // Load initial tasks on mount
    window.addEventListener('DOMContentLoaded', () => {
      loadTasks();
      loadAnalytics();
      initLiveEventSource();
    });

    // 1. Fetch live tasks from PostgreSQL
    async function loadTasks() {
      try {
        const res = await fetch('/api/v1/tasks');
        allTasks = await res.json();
        renderBoard(allTasks);
      } catch (err) {
        console.error('Failed to load tasks:', err);
      }
    }

    // 2. Fetch analytics & velocity
    async function loadAnalytics() {
      try {
        const res = await fetch('/api/v1/analytics');
        const data = await res.json();
        document.getElementById('sprintBadge').innerHTML = `Sprint 4 &bull; ${data.completionPercentage}% Done`;
        document.getElementById('taskStats').innerHTML = `${data.total} issues &bull; ${data.totalHours} hrs estimated &bull; ${data.blocked} blocked`;
      } catch (err) {
        console.error('Failed to load analytics:', err);
      }
    }

    // 3. Render Kanban Columns
    function renderBoard(tasks) {
      const cols = {
        BACKLOG: document.getElementById('col-BACKLOG'),
        IN_PROGRESS: document.getElementById('col-IN_PROGRESS'),
        BLOCKED: document.getElementById('col-BLOCKED'),
        DONE: document.getElementById('col-DONE')
      };

      Object.values(cols).forEach(col => col.innerHTML = '');

      const counts = { BACKLOG: 0, IN_PROGRESS: 0, BLOCKED: 0, DONE: 0 };

      tasks.forEach(task => {
        let bucket = 'BACKLOG';
        if (task.status === 'IN_PROGRESS') bucket = 'IN_PROGRESS';
        else if (task.status === 'BLOCKED' || task.status === 'REVIEW') bucket = 'BLOCKED';
        else if (task.status === 'DONE') bucket = 'DONE';

        counts[bucket] = (counts[bucket] || 0) + 1;

        const card = createCardElement(task);
        if (cols[bucket]) cols[bucket].appendChild(card);
      });

      document.getElementById('count-BACKLOG').innerText = counts.BACKLOG;
      document.getElementById('count-IN_PROGRESS').innerText = counts.IN_PROGRESS;
      document.getElementById('count-BLOCKED').innerText = counts.BLOCKED;
      document.getElementById('count-DONE').innerText = counts.DONE;
    }

    // 4. Create Task Card HTML
    function createCardElement(task) {
      const card = document.createElement('div');
      card.className = `bg-cardBg hover:bg-cardHover border ${task.status === 'BLOCKED' ? 'border-rose-500/40' : task.status === 'IN_PROGRESS' ? 'border-amber-500/30' : 'border-borderSubtle'} hover:border-borderHover p-3 rounded-md transition cursor-pointer group card-enter shadow-sm`;
      card.onclick = () => openDrawer(task.id);

      const priorityColors = {
        URGENT: 'bg-rose-500/10 text-rose-400 border-rose-500/20',
        HIGH: 'bg-indigo-500/10 text-indigo-300 border-indigo-500/20',
        MEDIUM: 'bg-amber-500/10 text-amber-400 border-amber-500/20',
        LOW: 'bg-slate-800 text-slate-400 border-slate-700/50'
      };

      const hasBlockers = task.dependencies && task.dependencies.length > 0;
      const isBlocked = task.status === 'BLOCKED';

      card.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <span class="font-mono text-[11px] ${isBlocked ? 'text-rose-400' : 'text-slate-400'} group-hover:text-indigo-300 transition">
            ${task.id.substring(0, 8)}
          </span>
          <span class="text-[10px] font-medium px-1.5 py-0.5 rounded border ${priorityColors[task.priority] || priorityColors.MEDIUM}">
            ${task.priority}
          </span>
        </div>
        <p class="text-xs font-semibold ${task.status === 'DONE' ? 'line-through text-slate-400' : 'text-slate-100'} leading-snug">
          ${task.title}
        </p>
        
        ${isBlocked ? `
          <div class="mt-2 flex items-center gap-1.5 text-[10px] font-mono text-rose-300 bg-rose-950/40 px-2 py-0.5 rounded border border-rose-800/40">
            <i class="ph ph-warning-octagon"></i>
            <span>BLOCKED by Prerequisite</span>
          </div>
        ` : ''}

        <div class="mt-3 flex items-center justify-between text-[11px] text-slate-500 pt-2 border-t border-borderSubtle/60">
          <span class="flex items-center gap-1"><i class="ph ph-clock"></i> ${task.estimatedHours || 1}h</span>
          <div class="flex items-center gap-1.5">
            ${task.comments && task.comments.length > 0 ? `<span class="flex items-center gap-0.5 text-slate-400"><i class="ph ph-chat-circle"></i> ${task.comments.length}</span>` : ''}
            <div class="w-5 h-5 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-[9px] font-mono text-slate-300">
              ${(task.assignee?.name || 'AC').substring(0, 2).toUpperCase()}
            </div>
          </div>
        </div>
      `;
      return card;
    }

    // 5. Open Task Detail Drawer
    async function openDrawer(taskId) {
      currentActiveTaskId = taskId;
      try {
        const res = await fetch(`/api/v1/tasks/${taskId}`);
        const task = await res.json();

        document.getElementById('drawerTaskKey').innerText = task.id;
        document.getElementById('drawerTaskTitle').innerText = task.title;
        document.getElementById('drawerTaskDesc').innerText = task.description || 'No description provided.';

        // Dependencies
        const depContainer = document.getElementById('drawerDependencies');
        if (task.dependencies && task.dependencies.length > 0) {
          depContainer.innerHTML = `
            <p class="font-semibold text-slate-300 mb-1">Prerequisite Dependencies:</p>
            ${task.dependencies.map(d => `
              <div class="bg-obsidian p-2 rounded border border-borderSubtle flex justify-between items-center text-[11px]">
                <span class="font-mono text-indigo-300">${d.dependsOnTask.title}</span>
                <span class="px-1.5 py-0.5 rounded text-[10px] ${d.dependsOnTask.status === 'DONE' ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">${d.dependsOnTask.status}</span>
              </div>
            `).join('')}
          `;
        } else {
          depContainer.innerHTML = '';
        }

        // Comments
        const commentContainer = document.getElementById('drawerComments');
        if (task.comments && task.comments.length > 0) {
          commentContainer.innerHTML = task.comments.map(c => `
            <div class="bg-obsidian p-2 rounded border border-borderSubtle">
              <div class="flex justify-between text-[10px] text-slate-500 mb-1">
                <span class="font-semibold text-slate-300">${c.user?.name || 'User'}</span>
                <span>${new Date(c.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
              </div>
              <p class="text-slate-300">${c.content}</p>
            </div>
          `).join('');
        } else {
          commentContainer.innerHTML = '<p class="text-slate-500 italic">No comments yet.</p>';
        }

        // Activity Logs
        const logContainer = document.getElementById('drawerActivityLogs');
        if (task.activityLogs && task.activityLogs.length > 0) {
          logContainer.innerHTML = task.activityLogs.map(l => `
            <div>&bull; ${l.details || l.action} <span class="text-slate-600">(${new Date(l.createdAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})</span></div>
          `).join('');
        } else {
          logContainer.innerHTML = '<div>No activity logged yet.</div>';
        }

        document.getElementById('taskDrawer').classList.remove('hidden');
        document.getElementById('taskDrawer').classList.add('flex');
      } catch (err) {
        console.error(err);
      }
    }

    function closeDrawer() {
      document.getElementById('taskDrawer').classList.add('hidden');
      document.getElementById('taskDrawer').classList.remove('flex');
      currentActiveTaskId = null;
    }

    // 6. Move Task Status
    async function moveCurrentTask(newStatus) {
      if (!currentActiveTaskId) return;
      try {
        const res = await fetch(`/api/v1/tasks/${currentActiveTaskId}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        const result = await res.json();
        if (result.error) {
          alert(`State Machine Error: ${result.error}`);
        } else {
          loadTasks();
          loadAnalytics();
          openDrawer(currentActiveTaskId);
        }
      } catch (err) {
        console.error(err);
      }
    }

    // 7. Post Comment
    async function postComment() {
      const input = document.getElementById('commentInput');
      const content = input.value.trim();
      if (!content || !currentActiveTaskId) return;

      await fetch(`/api/v1/tasks/${currentActiveTaskId}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content })
      });

      input.value = '';
      openDrawer(currentActiveTaskId);
      loadTasks();
    }

    // 8. Create Task Modal Logic
    function openCreateModal(status = 'BACKLOG') {
      document.getElementById('createModal').classList.remove('hidden');
      document.getElementById('createModal').classList.add('flex');
    }
    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
      document.getElementById('createModal').classList.remove('flex');
    }
    async function submitNewTask() {
      const title = document.getElementById('newTitle').value.trim();
      const description = document.getElementById('newDesc').value.trim();
      const priority = document.getElementById('newPriority').value;
      const estimatedHours = document.getElementById('newHours').value;

      if (!title) { alert('Title is required'); return; }

      await fetch('/api/v1/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description, priority, estimatedHours })
      });

      closeCreateModal();
      document.getElementById('newTitle').value = '';
      document.getElementById('newDesc').value = '';
      loadTasks();
      loadAnalytics();
    }

    // 9. Export iCal Calendar Feed
    async function exportCalendar() {
      window.open('/api/v1/tasks', '_blank');
    }

    // 10. Real-time Live SSE Connection
    function initLiveEventSource() {
      const sse = new EventSource('/api/v1/events/live');

      sse.addEventListener('task_update', (e) => {
        const payload = JSON.parse(e.data);
        console.log('⚡ Real-Time MCP Event received:', payload);
        loadTasks();
        loadAnalytics();
        if (currentActiveTaskId) openDrawer(currentActiveTaskId);
      });

      sse.onerror = () => {
        document.getElementById('liveSyncPill').innerHTML = `
          <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
          <span>Reconnecting...</span>
        `;
      };
    }
  </script>
</body>
</html>
