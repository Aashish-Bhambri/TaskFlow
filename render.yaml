services:
  - type: web
    name: taskflow-saas
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
